services:
  # 3Speak Video Encoder
  encoder:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: ghcr.io/mantequilla-soft/3speakencoder:latest
    container_name: 3speak-encoder
    restart: unless-stopped
    depends_on:
      - ipfs

    # Port mapping
    ports:
      - "3001:3001"  # Dashboard
      - "3002:3002"  # Direct API

    # Your settings (HIVE_USERNAME, ENCODER_PRIVATE_KEY, job sources...) from .env.
    # Keep ENCODER_PRIVATE_KEY in there, or the encoder gets a new identity on every restart.
    env_file:
      - path: .env
        required: false

    # Container-specific settings (override .env)
    environment:
      - HIVE_USERNAME=${HIVE_USERNAME:-your-hive-username}
      - EMBED_SYSTEM_ENABLED=${EMBED_SYSTEM_ENABLED:-true}
      - EMBED_SYSTEM_MODE=${EMBED_SYSTEM_MODE:-community}
      - EMBED_GATEWAY_URL=${EMBED_GATEWAY_URL:-https://embed.3speak.tv}
      # Inside the container 127.0.0.1 is the container itself; use the ipfs service below
      - IPFS_API_ADDR=/dns4/ipfs/tcp/5001

    # Volume mounts
    volumes:
      # Pending pins + local pin database
      - encoder_data:/app/data
      # Encode scratch space (TEMP_DIR)
      - encoder_work:/app/work

    # Resource limits (optional)
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

    # Health check (busybox wget; the image has no curl)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # IPFS daemon the encoder uploads to. Its API is only reachable on the compose network.
  ipfs:
    image: ipfs/kubo:latest
    container_name: 3speak-ipfs
    restart: unless-stopped
    ports:
      - "4001:4001"      # swarm (TCP)
      - "4001:4001/udp"  # swarm (QUIC)
    volumes:
      - ipfs_data:/data/ipfs

# Named volumes
volumes:
  encoder_data:
    driver: local
  encoder_work:
    driver: local
  ipfs_data:
    driver: local

# Networks (optional for isolation)
networks:
  default:
    name: 3speak-network
